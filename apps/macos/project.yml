# XcodeGen spec — the source of truth for Rallo.xcodeproj (generated, gitignored).
# Regenerate with: (cd apps/macos && xcodegen generate)
name: Rallo
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Apple Silicon only until Intel is validated on real hardware.
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: 0.12.1
    CURRENT_PROJECT_VERSION: "22"
    SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Rallo/Generated
    LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../build/rust/lib
    OTHER_LDFLAGS: -lrallo_ffi
targets:
  Rallo:
    type: application
    platform: macOS
    sources:
      - path: Rallo
    settings:
      base:
        PRODUCT_NAME: Rallo
        PRODUCT_BUNDLE_IDENTIFIER: com.razlio.rallo
        INFOPLIST_FILE: Rallo/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Rallo/Resources/Rallo.entitlements
        # No get-task-allow in shipped builds (it lets same-user processes attach).
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # whisper.cpp is linked statically (0014).
        SWIFT_INCLUDE_PATHS: $(inherited) $(PROJECT_DIR)/../../build/whisper/v1.9.4/include
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../../build/whisper/v1.9.4/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../../build/whisper/v1.9.4/lib
        OTHER_LDFLAGS: $(inherited) -lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -lc++ -framework Accelerate -framework Metal -framework MetalKit -framework Foundation
    preBuildScripts:
      - name: Build whisper.cpp
        script: '"$PROJECT_DIR/../../scripts/build-whisper.sh"'
        basedOnDependencyAnalysis: false
      - name: Build Rust core, bindings, and CLI
        script: '"$PROJECT_DIR/../../scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed rallo CLI
        script: '"$PROJECT_DIR/../../scripts/embed-cli.sh"'
        basedOnDependencyAnalysis: false
  RalloTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RalloTests
      - path: Rallo/Generated/rallo_ffi.swift
      - path: Rallo/Core/CoreWorker.swift
      - path: Rallo/Core/CoreClient.swift
      - path: Rallo/Capture/CaptureService.swift
      - path: Rallo/Capture/ServicesProvider.swift
      - path: Rallo/Setup/TerminalCommand.swift
      - path: Rallo/Pet/Stroke.swift
      - path: Rallo/Voice/VoiceKeyGesture.swift
      - path: Rallo/Pet/PetWatermarks.swift
      - path: Rallo/Notes/AgentSessionFormatting.swift
      - path: Rallo/Notes/AgentSessionActivation.swift
      - path: Rallo/Notes/CustomRemindPreview.swift
      - path: Rallo/Notes/ReminderLabel.swift
      - path: Rallo/Notes/NoteParts.swift
      - path: Rallo/Notes/ImageClipboard.swift
      - path: Rallo/Notes/Thumbnails.swift
      - path: Rallo/Notes/RalloError+Display.swift
      - path: Rallo/NotesWindow/DateGrouping.swift
      - path: Rallo/NotesWindow/FolderNaming.swift
      - path: Rallo/NotesWindow/NotesWindowSelection.swift
      - path: Rallo/NotesWindow/SaveScheduler.swift
      - path: Rallo/Notes/NotesScope.swift
      - path: Rallo/Notes/PanelDefaults.swift
      - path: Rallo/Notes/FolderMenuItems.swift
      - path: Rallo/Notes/FolderNamePrompter.swift
      - path: Rallo/Notes/NotesViewModel.swift
      - path: Rallo/Notes/SwipeMetrics.swift
      - path: Rallo/Notes/RemindPreset.swift
      - path: Rallo/Notes/TagTint.swift
      - path: Rallo/Shared/Theme.swift
      - path: Rallo/ClickUp/ClickUpWaiting.swift
      - path: Rallo/Notifications/NotificationAdapter.swift
      - path: Rallo/Notifications/AgentNotificationIdentifier.swift
      - path: Rallo/Notifications/AgentWaitPlanner.swift
      - path: Rallo/App/AgentJumpPlanner.swift
      - path: Rallo/App/LaunchOptions.swift
      - path: Rallo/Settings/CLIReports.swift
      - path: Rallo/Voice/VoiceText.swift
      - path: Rallo/Voice/WhisperText.swift
      - path: Rallo/Voice/SpeechSegmenter.swift
      - path: Rallo/Voice/WhisperModelStore.swift
      - path: Rallo/Voice/CloudVoiceSupport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.razlio.rallo.tests
        GENERATE_INFOPLIST_FILE: YES
    preBuildScripts:
      - name: Build Rust core and bindings
        script: '"$PROJECT_DIR/../../scripts/generate-bindings.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Rallo:
    build:
      targets:
        Rallo: all
        RalloTests: [test]
    test:
      targets:
        - RalloTests
