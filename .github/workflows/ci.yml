# Rust checks for every pull request and every push to master. Required
# before a pull request can merge (branch ruleset). The Swift app needs a
# newer Xcode than the hosted runners carry, so it is built and tested
# locally by scripts/release.sh.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Same toolchain as local development, so a new stable release's
      # lints can't fail CI on their own.
      RUST_TOOLCHAIN: "1.98.1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
