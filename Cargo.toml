[workspace]
resolver = "3"
members = [
    "crates/rallo-core",
    "crates/rallo-cli",
    "crates/rallo-platform-macos",
    "crates/rallo-ffi",
]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
rallo-core = { path = "crates/rallo-core" }
rallo-platform-macos = { path = "crates/rallo-platform-macos" }
caseless = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
uniffi = "0.32.2"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = false
strip = "symbols"
